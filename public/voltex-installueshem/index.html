<title>VOLTEX • Formula & Komponentë</title>
<style>
  :root{
    --bg:#10141a;--panel:#161c25;--panel-2:#1d2530;--line:#2a3441;
    --ink:#f4f5f6;--muted:#9da5ae;--copper:#ff6700;--copper-dim:#b94b00;
    --lcd:#5ce1c4;--lcd-dim:#2f6b5f;--warn:#ffcc4d;--bad:#ff6b6b;
    --mono:'JetBrains Mono','SFMono-Regular',ui-monospace,Consolas,monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    padding-bottom:env(safe-area-inset-bottom);overflow-x:hidden;}
  header{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#141a22,#10141a);
    border-bottom:1px solid var(--line);padding:13px 16px;padding-top:calc(13px + env(safe-area-inset-top));}
  .brand{display:flex;align-items:center;gap:11px;cursor:pointer;width:max-content;}
  .bolt{width:34px;height:34px;flex:0 0 34px;border-radius:9px;
    background:radial-gradient(circle at 30% 25%,#f0a35a,var(--copper) 60%,var(--copper-dim));
    display:grid;place-items:center;box-shadow:0 0 0 1px rgba(232,137,58,.3),0 6px 18px -8px rgba(232,137,58,.7);}
  .bolt svg{width:24px;height:24px;}
  .bolt img{display:block;width:100%;height:100%;object-fit:cover;border-radius:9px;}
  .brand h1{font-size:1.05rem;margin:0;letter-spacing:.3px;font-weight:700;}
  .brand p{margin:0;font-size:.7rem;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;}
  /* mode switch */
  .modes{display:flex;gap:8px;margin-top:11px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .modes::-webkit-scrollbar{display:none;}
  .mode{flex:1 0 auto;font-family:var(--sans);font-size:.79rem;font-weight:700;padding:9px 13px;
    background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:.16s;}
  .mode.on{background:var(--copper);color:#1a1208;border-color:var(--copper);box-shadow:0 4px 14px -6px rgba(232,137,58,.8);}
  nav{position:sticky;z-index:25;top:calc(112px + env(safe-area-inset-top));background:var(--bg);
    border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  nav::-webkit-scrollbar{display:none;}
  .tabs{display:flex;gap:6px;padding:10px 12px;min-width:max-content;}
  .tab{font-family:var(--sans);font-size:.8rem;font-weight:600;color:var(--muted);background:var(--panel);
    border:1px solid var(--line);border-radius:999px;padding:7px 13px;white-space:nowrap;cursor:pointer;transition:.16s;}
  .tab:hover{color:var(--ink);}
  .tab.active{color:#1a1208;background:var(--copper);border-color:var(--copper);}
  main{max-width:1020px;margin:0 auto;padding:16px 14px 60px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 15px 14px;display:flex;flex-direction:column;}
  .card h3{margin:0 0 3px;font-size:.95rem;font-weight:700;display:flex;align-items:center;gap:8px;}
  .card h3 .dot{width:7px;height:7px;border-radius:50%;background:var(--copper);flex:0 0 7px;}
  .card .formula{font-family:var(--mono);font-size:.73rem;color:var(--muted);margin:0 0 12px;letter-spacing:.2px;}
  .row{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
  .row label{font-size:.77rem;color:var(--muted);}
  .inp{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel-2);transition:.15s;}
  .inp:focus-within{border-color:var(--copper);box-shadow:0 0 0 3px rgba(232,137,58,.12);}
  .inp input,.inp select{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--ink);font-family:var(--mono);font-size:.95rem;padding:9px 11px;}
  .inp select{font-family:var(--sans);cursor:pointer;}
  .inp select option{background:var(--panel-2);}
  .inp .unit{display:grid;place-items:center;padding:0 10px;font-family:var(--mono);font-size:.78rem;color:var(--muted);background:rgba(255,255,255,.02);border-left:1px solid var(--line);min-width:44px;}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}
  input[type=text].search{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;
    color:var(--ink);font-family:var(--sans);font-size:.95rem;padding:12px 14px;outline:0;transition:.15s;}
  input[type=text].search:focus{border-color:var(--copper);box-shadow:0 0 0 3px rgba(232,137,58,.12);}
  .result{margin-top:auto;background:#0c1014;border:1px solid var(--lcd-dim);border-radius:10px;padding:10px 13px;display:flex;flex-direction:column;gap:6px;}
  .res-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .res-line .rlabel{font-size:.73rem;color:var(--muted);}
  .res-line .rval{font-family:var(--mono);font-weight:600;color:var(--lcd);font-size:1.13rem;letter-spacing:.5px;text-shadow:0 0 14px rgba(92,225,196,.35);}
  .res-line .rval small{font-size:.68rem;color:var(--lcd-dim);font-weight:400;margin-left:3px;}
  .res-line.warn .rval{color:var(--warn);}
  .res-line.bad .rval{color:var(--bad);}
  .tip{font-size:.7rem;color:var(--lcd-dim);margin-top:7px;}
  .note{font-size:.71rem;color:var(--muted);margin-top:8px;line-height:1.4;}
  .note b{color:var(--copper);}
  .seg{display:flex;gap:6px;margin-bottom:10px;}
  .seg button{flex:1;font-family:var(--sans);font-size:.75rem;font-weight:600;background:var(--panel-2);color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:7px 0;cursor:pointer;transition:.14s;}
  .seg button.on{background:var(--copper-dim);color:#fff;border-color:var(--copper);}
  /* component library */
  .lib-head{margin-bottom:14px;}
  .lib-count{font-size:.74rem;color:var(--muted);margin-top:7px;}
  .lib-count b{color:var(--lcd);}
  .cat-title{font-size:.78rem;font-weight:700;color:var(--copper);text-transform:uppercase;letter-spacing:1px;
    margin:22px 0 10px;display:flex;align-items:center;gap:10px;}
  .cat-title::after{content:'';flex:1;height:1px;background:var(--line);}
  .comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;}
  .comp{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 13px;}
  .comp .cname{font-weight:700;font-size:.88rem;display:flex;align-items:center;gap:7px;}
  .comp .cname::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--lcd-dim);flex:0 0 6px;}
  .comp .cdesc{font-size:.76rem;color:var(--muted);margin-top:4px;line-height:1.45;}
  .card-photo{display:block;position:relative;margin:12px 0 10px;border:2px solid #f07a32;border-radius:12px;
    overflow:hidden;background:#f2f2f2;text-decoration:none;aspect-ratio:4/3;min-height:210px;box-shadow:0 8px 20px rgba(85,38,8,.16);}
  .card-photo img{display:block;width:100%;height:100%;object-fit:contain;background:#fff;transition:transform .2s,opacity .2s;}
  .card-photo:hover img{transform:scale(1.04);}
  .card-photo .photo-label{position:absolute;left:9px;right:9px;bottom:9px;padding:8px 10px;border-radius:8px;
    background:rgba(12,16,20,.9);color:#fff;font-size:.74rem;font-weight:800;text-align:center;backdrop-filter:blur(5px);}
  .card-photo.loading img{opacity:.72;}
  .card-photo.fallback{border-color:var(--lcd-dim);}
  .cphoto{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:.72rem;font-weight:600;color:var(--copper);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:5px 9px;background:var(--panel-2);transition:.14s;}
  .cphoto:hover,.cphoto:active{border-color:var(--copper);background:rgba(232,137,58,.1);}
  .pcomps{font-size:.71rem;color:var(--muted);margin-top:7px;line-height:1.45;}
  .pcomps b{color:var(--lcd-dim);font-weight:700;}
  .vbadge{display:inline-block;font-size:.62rem;font-weight:700;color:var(--warn);border:1px solid rgba(255,204,77,.45);border-radius:5px;padding:1px 6px;margin-left:7px;letter-spacing:.4px;vertical-align:1px;}
  .pbtns{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;}
  .badge{font-size:.6rem;font-weight:700;color:#1a1208;background:var(--warn);border-radius:5px;padding:2px 6px;margin-left:auto;white-space:nowrap;}
  .pcomps{font-size:.71rem;color:var(--lcd-dim);margin-top:7px;line-height:1.45;}
  .pcomps b{color:var(--muted);font-weight:600;}
  .ladder-symbol{display:flex;align-items:center;justify-content:center;min-height:54px;margin:10px 0 8px;
    padding:10px 8px;border:1px solid var(--lcd-dim);border-radius:9px;background:#0c1014;color:var(--lcd);
    font-family:var(--mono);font-size:1.05rem;font-weight:700;letter-spacing:.5px;white-space:pre;text-shadow:0 0 14px rgba(92,225,196,.3);}
  .ladder-kind{font-family:var(--mono);font-size:.66rem;color:var(--copper);text-transform:uppercase;letter-spacing:.7px;margin-top:2px;}
  .engineering-symbol{display:grid;place-items:center;min-height:104px;margin:10px 0 8px;padding:8px;
    border:1px solid var(--lcd-dim);border-radius:9px;background:#f5f7f8;color:#111;}
  .engineering-symbol svg{display:block;width:100%;max-width:210px;height:82px;}
  .symbol-code{font-family:var(--mono);font-size:.64rem;color:var(--copper);letter-spacing:.4px;margin-top:3px;}
  .pin-code{display:inline-flex;align-items:center;justify-content:center;min-width:58px;margin:10px 0 8px;
    padding:7px 11px;border:1px solid var(--lcd-dim);border-radius:8px;background:#0c1014;color:var(--lcd);
    font-family:var(--mono);font-size:1rem;font-weight:700;letter-spacing:.5px;text-shadow:0 0 12px rgba(92,225,196,.3);}
  .code-box{margin-top:10px;border:1px solid var(--line);border-radius:9px;background:#0c1014;overflow:hidden;}
  .code-box summary{cursor:pointer;padding:9px 11px;color:var(--copper);font-size:.74rem;font-weight:700;list-style:none;}
  .code-box summary::-webkit-details-marker{display:none;}
  .code-box summary::before{content:'▸';display:inline-block;margin-right:7px;transition:.15s;}
  .code-box[open] summary::before{transform:rotate(90deg);}
  .code-wrap{position:relative;border-top:1px solid var(--line);}
  .code-wrap pre{margin:0;padding:42px 12px 13px;max-height:360px;overflow:auto;color:#b8e8dc;
    font-family:var(--mono);font-size:.69rem;line-height:1.55;white-space:pre;tab-size:2;}
  .copy-code{position:absolute;right:8px;top:8px;z-index:2;border:1px solid var(--lcd-dim);border-radius:7px;
    padding:5px 9px;background:var(--panel-2);color:var(--lcd);font:700 .66rem var(--sans);cursor:pointer;}
  .copy-code.copied{border-color:var(--copper);color:var(--copper);}
  .lesson-card .lesson-goal{margin-top:7px;padding:8px 10px;border-left:3px solid var(--lcd-dim);border-radius:0 7px 7px 0;
    background:#0c1014;color:var(--ink);font-size:.75rem;line-height:1.45;}
  .lesson-points{margin:9px 0 0;padding-left:18px;color:var(--muted);font-size:.72rem;line-height:1.5;}
  .lesson-points li+li{margin-top:4px;}
  .lesson-tag{display:inline-block;margin-top:8px;border:1px solid var(--line);border-radius:999px;
    padding:3px 8px;color:var(--lcd);background:var(--panel-2);font-size:.62rem;font-weight:800;letter-spacing:.45px;text-transform:uppercase;}
  .topic-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;align-items:stretch;}
  .topic-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:start;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:116px;height:100%;}
  .topic-row.done{border-color:var(--lcd-dim);background:rgba(92,225,196,.06);}
  .topic-nr{font-family:var(--mono);font-size:.72rem;color:var(--copper);font-weight:800;}
  .topic-name{font-size:.82rem;color:var(--ink);font-weight:650;}
  .topic-desc{grid-column:2/-1;margin-top:-3px;color:var(--muted);font-size:.72rem;line-height:1.45;}
  @media(max-width:520px){.topic-list{grid-template-columns:1fr}.topic-row{grid-template-columns:36px 1fr;min-height:auto}.topic-desc{grid-column:1/-1;}}
  .calc-action{width:100%;margin:2px 0 10px;padding:10px 12px;border:1px solid var(--copper);border-radius:9px;
    background:var(--copper);color:#1a1208;font:700 .8rem var(--sans);cursor:pointer;}
  .calc-error{display:none;margin:0 0 10px;padding:8px 10px;border:1px solid rgba(255,107,107,.45);
    border-radius:8px;background:rgba(255,107,107,.08);color:var(--bad);font-size:.72rem;}
  .calc-error.show{display:block;}
  .res-line[data-row="cs_recommended"]{margin-top:4px;padding-top:8px;border-top:1px solid var(--lcd-dim);}
  .res-line[data-row="cs_recommended"] .rlabel,.res-line[data-row="cs_breaker"] .rlabel{color:var(--ink);font-weight:700;}
  .res-line[data-row="cs_recommended"] .rval,.res-line[data-row="cs_breaker"] .rval{font-size:1.38rem;color:var(--warn);}
  .safety-banner{margin:0 0 15px;padding:12px 13px;border:1px solid rgba(255,107,107,.5);border-radius:10px;
    background:rgba(255,107,107,.08);color:#ffd2d2;font-size:.75rem;line-height:1.5;}
  .safety-banner b{color:var(--bad);}
  .fault-card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px;}
  .fault-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .fault-title{font-size:.9rem;font-weight:700;line-height:1.35;}
  .risk{flex:0 0 auto;font-size:.58rem;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
    border-radius:5px;padding:3px 6px;border:1px solid currentColor;}
  .risk-low{color:var(--lcd);}
  .risk-medium{color:var(--warn);}
  .risk-high{color:#ff9c5b;}
  .risk-critical{color:var(--bad);background:rgba(255,107,107,.08);}
  .fault-symptom{margin-top:8px;padding:8px 10px;border-left:3px solid var(--copper);border-radius:0 7px 7px 0;
    background:rgba(232,137,58,.07);font-size:.75rem;color:var(--ink);line-height:1.45;}
  .fault-symptom b{color:var(--copper);}
  .fault-detail{margin-top:8px;border:1px solid var(--line);border-radius:8px;background:#0c1014;overflow:hidden;}
  .fault-detail summary{cursor:pointer;padding:8px 10px;color:var(--lcd);font-size:.72rem;font-weight:700;list-style:none;}
  .fault-detail summary::-webkit-details-marker{display:none;}
  .fault-detail summary::before{content:'▸';display:inline-block;margin-right:6px;transition:.15s;}
  .fault-detail[open] summary::before{transform:rotate(90deg);}
  .fault-body{border-top:1px solid var(--line);padding:8px 11px;color:var(--muted);font-size:.72rem;line-height:1.5;}
  .fault-body ul{margin:0;padding-left:17px;}
  .fault-body li+li{margin-top:4px;}
  .fault-fix .fault-body{color:#b8e8dc;}
  .fault-photo{display:inline-flex;margin-top:9px;color:var(--copper);font-size:.68rem;font-weight:700;text-decoration:none;}
  .technician-banner{margin:0 0 15px;padding:14px;border:1px solid #f08a48;border-radius:12px;background:#fff3e9;color:#5d2a0b;font-size:.8rem;line-height:1.55;}
  .technician-banner b{color:#c54800;}
  .fault-body ol{margin:0;padding-left:22px;}
  .fault-body ol li::marker{color:var(--copper);font-weight:800;}
  .fault-body li+li{margin-top:6px;}

  footer{text-align:center;color:var(--muted);font-size:.71rem;padding:26px 16px 40px;border-top:1px solid var(--line);margin-top:24px;}
  footer b{color:var(--copper);}
  /* Voltex phone-style home screen */
  body.home-mode{background:#080909;}
  body.home-mode header,body.home-mode nav,body.home-mode footer{display:none!important;}
  body.home-mode main{max-width:none;padding:0;min-height:100svh;}
  .home-screen{width:min(100%,560px);min-height:100svh;margin:0 auto;background:#0c0d0e;box-shadow:0 0 60px rgba(0,0,0,.7);overflow:hidden;}
  .home-hero{position:relative;overflow:hidden;padding:calc(28px + env(safe-area-inset-top)) 20px 24px;text-align:center;
    background:radial-gradient(circle at 72% 22%,#ff8a00 0,#ff5c00 34%,#ed3e00 74%,#bd2500 100%);}
  .home-hero::after{content:'';position:absolute;inset:auto -15% -55px;background:#0c0d0e;height:95px;border-radius:50% 50% 0 0/55% 55% 0 0;}
  .home-mark{position:relative;z-index:1;display:block;width:94px;height:94px;margin:0 auto 5px;filter:drop-shadow(0 8px 16px rgba(73,16,0,.25));}
  .home-hero h1{position:relative;z-index:1;margin:0;color:#fff;font-size:2rem;line-height:1;letter-spacing:1.2px;text-transform:uppercase;font-weight:900;}
  .home-hero h2{position:relative;z-index:1;margin:6px 0 0;color:#fff;font-size:.92rem;line-height:1;letter-spacing:6px;text-transform:uppercase;font-weight:750;}
  .home-spec{position:relative;z-index:1;margin:20px 0 24px;color:rgba(255,255,255,.92);font-size:.72rem;line-height:1.55;}
  .home-menu{position:relative;z-index:2;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px 22px;margin-top:-1px;}
  .home-tile{min-height:132px;border:1px solid #2a2c2f;border-radius:18px;background:linear-gradient(145deg,#222426,#151617);
    color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px 9px;font:750 .92rem var(--sans);
    text-align:center;cursor:pointer;box-shadow:inset 0 1px rgba(255,255,255,.035),0 12px 24px rgba(0,0,0,.18);transition:.16s;}
  .home-tile:active{transform:scale(.975);border-color:var(--copper);background:#252526;}
  .home-tile svg{width:43px;height:43px;stroke:#f1f1f1;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .home-tile[data-go="calc"] svg{stroke:var(--copper);fill:var(--copper);}
  .home-tile[data-go="electric"] svg{stroke:var(--copper);}
  .home-menu .home-tile:last-child:nth-child(odd){grid-column:1/-1;min-height:112px;}
  .creator-credit{margin:0;padding:18px 16px 8px;text-align:center;color:#d9dcdf;font-size:.76rem;line-height:1.5;background:#0c0d0e;}
  .creator-credit b{color:var(--copper);}
  .home-trust{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:17px 10px calc(18px + env(safe-area-inset-bottom));border-top:1px solid #292b2d;
    background:linear-gradient(180deg,#151617,#0c0d0e);color:#dadde0;text-align:center;font-size:.58rem;}
  .home-trust span{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .home-trust b{display:grid;place-items:center;width:27px;height:27px;border:1px solid var(--copper);border-radius:50%;color:var(--copper);font-size:.74rem;}
  .home-tagline{padding:0 16px 22px;text-align:center;color:#a7adb3;font-size:.69rem;background:#0c0d0e;}
  /* Single open section: orange/white interior with a clear exit */
  body:not(.home-mode){--bg:#f4f4f3;--panel:#fff;--panel-2:#fff7f1;--line:#ead7ca;--ink:#202020;--muted:#6e6e6e;--lcd:#b84700;--lcd-dim:#de6a20;background:var(--bg);}
  body:not(.home-mode) header{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#ff7200,#ed4100);border-bottom:0;box-shadow:0 5px 20px rgba(121,38,0,.2);}
  body:not(.home-mode) .brand h1,body:not(.home-mode) .brand p{color:#fff;}
  body:not(.home-mode) .modes{display:none;}
  body:not(.home-mode) nav{top:calc(61px + env(safe-area-inset-top));background:rgba(255,255,255,.96);border-bottom-color:#ead7ca;}
  body:not(.home-mode) .tab{background:#fff;color:#6a3a20;border-color:#f0c3a5;}
  body:not(.home-mode) .tab.active{color:#fff;background:var(--copper);}
  .theme-close{display:grid;place-items:center;flex:0 0 38px;width:38px;height:38px;border:2px solid rgba(255,255,255,.9);border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font:400 1.65rem/1 var(--sans);cursor:pointer;}
  .theme-close:active{transform:scale(.94);background:#fff;color:var(--copper);}
  body.home-mode .theme-close{display:none;}
  body:not(.home-mode) .card,body:not(.home-mode) .comp,body:not(.home-mode) .fault-card{box-shadow:0 8px 22px rgba(70,35,15,.06);}
  body:not(.home-mode) .result,body:not(.home-mode) .code-box,body:not(.home-mode) .fault-detail{background:#fff8f3;border-color:#efc2a5;}
  body:not(.home-mode) .res-line .rval,body:not(.home-mode) .code-wrap pre{color:#b84700;text-shadow:none;}
  body:not(.home-mode) .code-wrap{border-color:#efc2a5;}
  body:not(.home-mode) .copy-code{background:#fff;color:#c54b00;border-color:#f08a48;}
  body:not(.home-mode) .fault-body{color:#5d5d5d;border-color:#efc2a5;}
  body:not(.home-mode) .fault-fix .fault-body{color:#8d3500;}
  body:not(.home-mode) footer{background:#fff;color:#777;border-color:#ead7ca;}
  @media(min-width:700px){.home-screen{min-height:calc(100vh - 36px);margin:18px auto;border:1px solid #2b2d30;border-radius:30px;}.home-menu{padding-left:24px;padding-right:24px}.home-tile{min-height:142px}}
  @media(min-width:900px){
    .home-screen{width:min(calc(100% - 36px),1180px);}
    .home-menu{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:0 30px 30px;}
    .home-menu .home-tile:last-child:nth-child(odd){grid-column:auto;min-height:150px;}
    .home-tile{min-height:150px;}
    .home-hero{padding-left:40px;padding-right:40px;}
  }
  @media(max-width:520px){.grid,.comp-grid{grid-template-columns:1fr;}main{padding:14px 12px 50px;}.card-photo{min-height:240px}.home-menu{gap:10px;padding-left:12px;padding-right:12px}.home-tile{min-height:118px;padding-left:7px;padding-right:7px}.home-hero h1{font-size:1.8rem}.home-hero h2{letter-spacing:5px}.creator-credit{padding-left:18px;padding-right:18px}}
  @media(max-width:370px){.home-tile{min-height:108px;font-size:.82rem}.home-tile svg{width:38px;height:38px}.home-trust{font-size:.53rem}}
  @media(min-width:1100px){main{max-width:1240px}.grid{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}.comp-grid{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}}

  /* Diagnostifikim me multimetër */
  .diagnostics-page{max-width:1180px;margin:0 auto;}
  .diagnostics-head{margin-bottom:14px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,var(--panel),var(--panel-2));}
  .diagnostics-head h2{margin:0 0 6px;font-size:1.18rem;color:var(--ink);}
  .diagnostics-head p{margin:0;color:var(--muted);font-size:.78rem;line-height:1.55;}
  .diagnostics-warning{margin:0 0 14px;padding:12px 14px;border:1px solid rgba(255,204,77,.48);border-left:4px solid var(--warn);border-radius:10px;background:rgba(255,204,77,.08);color:var(--ink);font-size:.76rem;line-height:1.55;}
  .diagnostics-warning b{color:var(--warn);}
  .diagnostics-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:0 10px 28px rgba(0,0,0,.16);}
  .diagnostics-table{width:100%;min-width:900px;border-collapse:collapse;font-size:.76rem;}
  .diagnostics-table th,.diagnostics-table td{padding:12px 13px;text-align:left;vertical-align:top;border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
  .diagnostics-table th:last-child,.diagnostics-table td:last-child{border-right:0;}
  .diagnostics-table tbody tr:last-child td{border-bottom:0;}
  .diagnostics-table thead th{position:sticky;top:0;background:#222c38;color:var(--copper);font-size:.72rem;letter-spacing:.2px;z-index:1;}
  .diagnostics-table tbody tr:nth-child(even){background:rgba(255,255,255,.018);}
  .diagnostics-table tbody tr:hover{background:rgba(255,103,0,.06);}
  .diagnostics-table td:first-child{font-weight:750;color:var(--ink);}
  .diagnostics-table code{display:inline-block;padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--lcd);font-family:var(--mono);font-size:.72rem;white-space:nowrap;}
  .diagnostics-note{margin-top:12px;color:var(--muted);font-size:.68rem;line-height:1.5;}
  @media(max-width:700px){
    .diagnostics-head{padding:14px;}
    .diagnostics-table-wrap{overflow:visible;border:0;background:transparent;box-shadow:none;}
    .diagnostics-table{display:block;min-width:0;}
    .diagnostics-table thead{display:none;}
    .diagnostics-table tbody{display:grid;gap:11px;}
    .diagnostics-table tr{display:block;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;box-shadow:0 7px 18px rgba(0,0,0,.12);}
    .diagnostics-table tbody tr:nth-child(even),.diagnostics-table tbody tr:hover{background:var(--panel);}
    .diagnostics-table td{display:grid;grid-template-columns:minmax(112px,38%) 1fr;gap:10px;padding:9px 11px;border-right:0;border-bottom:1px solid var(--line);font-size:.72rem;}
    .diagnostics-table td:last-child{border-bottom:0;}
    .diagnostics-table td::before{content:attr(data-label);color:var(--copper);font-size:.64rem;font-weight:800;line-height:1.35;}
    .diagnostics-table td:first-child{padding:11px;background:rgba(255,103,0,.07);font-size:.82rem;}
    .diagnostics-table td:first-child::before{content:'Kontrolli';}
  }


  /* Pagesa VOLTEX Premium me Lemon Squeezy */
  .voltex-premium-card{position:relative;overflow:hidden;margin:18px auto 4px;max-width:620px;padding:20px 18px;border:1px solid rgba(255,184,77,.62);border-radius:18px;background:linear-gradient(145deg,rgba(255,121,0,.22),rgba(22,28,37,.98));box-shadow:0 14px 34px rgba(0,0,0,.28);text-align:center;}
  .voltex-premium-card::before{content:'';position:absolute;inset:-80px auto auto -70px;width:180px;height:180px;border-radius:50%;background:rgba(255,103,0,.14);filter:blur(2px);pointer-events:none;}
  .voltex-premium-badge{position:relative;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid rgba(255,203,112,.66);border-radius:999px;background:rgba(255,103,0,.16);color:#ffd29b;font-size:.65rem;font-weight:900;letter-spacing:1.4px;}
  .voltex-premium-title{position:relative;margin:12px 0 7px;color:#fff;font-size:1.3rem;letter-spacing:.5px;}
  .voltex-premium-text{position:relative;margin:0 auto 14px;max-width:470px;color:#d9dcdf;font-size:.79rem;line-height:1.55;}
  .voltex-premium-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:13px 22px;border:0;border-radius:12px;background:linear-gradient(135deg,#ff7900,#ee4500);color:#fff;text-decoration:none;font-weight:900;font-size:.92rem;box-shadow:0 10px 24px rgba(255,87,0,.32);transition:transform .16s,filter .16s;}
  .voltex-premium-btn:hover{filter:brightness(1.08);}
  .voltex-premium-btn:active{transform:translateY(1px) scale(.99);}
  .voltex-premium-note{position:relative;margin-top:10px;color:#aeb5bc;font-size:.67rem;line-height:1.45;}
  @media(max-width:520px){.voltex-premium-card{margin-left:12px;margin-right:12px;padding:18px 14px}.voltex-premium-btn{width:100%}}

  /* Instalimi i aplikacionit VOLTEX */
  .voltex-install-card{margin:16px auto 4px;max-width:620px;padding:16px;border:1px solid rgba(255,103,0,.45);border-radius:16px;background:linear-gradient(145deg,rgba(255,103,0,.14),rgba(22,28,37,.96));box-shadow:0 12px 28px rgba(0,0,0,.2);text-align:center;}
  .voltex-install-logo{width:72px;height:72px;border-radius:18px;object-fit:cover;box-shadow:0 8px 20px rgba(255,103,0,.25);}
  .voltex-install-title{margin:10px 0 4px;font-size:1.2rem;letter-spacing:1.5px;color:var(--ink);}
  .voltex-install-text{margin:0 0 12px;color:var(--muted);font-size:.78rem;line-height:1.5;}
  .voltex-install-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:12px 20px;border:0;border-radius:12px;background:var(--copper);color:#fff;font-weight:800;font-size:.9rem;cursor:pointer;box-shadow:0 8px 22px rgba(255,103,0,.3);}
  .voltex-install-btn:active{transform:translateY(1px);}
  .voltex-install-status{min-height:20px;margin:9px 0 0;color:#d9dcdf;font-size:.7rem;line-height:1.45;}
  @media(max-width:520px){.voltex-install-card{margin-left:12px;margin-right:12px;padding:14px}.voltex-install-logo{width:64px;height:64px}}

<body>

  if(n===null||n===undefined||isNaN(n)||!isFinite(n))return '—';
  if(n!==0&&Math.abs(n)<0.001)return n.toExponential(2);
  if(Math.abs(n)>=100000)return n.toLocaleString('en-US',{maximumFractionDigits:0});
  return Number(n.toFixed(d)).toLocaleString('en-US',{maximumFractionDigits:d});
};
const RHO={cu:0.0175,al:0.0285};
const STANDARD_SECTIONS_MM2=[
  1,1.5,2.5,4,6,10,16,25,35,50,
  70,95,120,150,185,240,300,400,500,630
];
const STANDARD_BREAKERS_A=[
  6,10,16,20,25,32,40,50,63,80,100,125,160,200,250,315,400,500,630
];
const CABLE_BREAKER_LIMITS_A={
  copper:{1:6,1.5:10,2.5:16,4:25,6:32,10:50,16:63,25:80,35:100,50:125,70:160,95:200,120:250,150:315,185:400,240:500,300:630,400:630,500:630,630:630},
  aluminium:{1:0,1.5:0,2.5:10,4:16,6:20,10:32,16:50,25:63,35:80,50:100,70:125,95:160,120:200,150:250,185:315,240:400,300:500,400:630,500:630,630:630}
};
function calculateCableSection({
  power,powerUnit='kW',phase='single',voltage=230,lengthM,
  material='copper',cosPhi=1,voltageDropPercent=3
}){
  if(!power||!lengthM)throw new Error('Vendos fuqinë dhe gjatësinë e kabllit.');
  if(voltage<=0||cosPhi<=0||voltageDropPercent<=0)throw new Error('Vlerat duhet të jenë më të mëdha se zero.');
  const P=powerUnit==='kW'?power*1000:power;
  const materialKey=(material==='copper'||material==='cu')?'copper':'aluminium';
  const rho=materialKey==='copper'?0.0175:0.0285;
  const deltaU=voltage*voltageDropPercent/100;
  let currentA,exactSectionMM2;
  if(phase==='single'){
    currentA=P/(voltage*cosPhi);
    exactSectionMM2=(2*rho*lengthM*P)/(voltage*cosPhi*deltaU);
  }else if(phase==='three'){
    currentA=P/(Math.sqrt(3)*voltage*cosPhi);
    exactSectionMM2=(rho*lengthM*P)/(voltage*cosPhi*deltaU);
  }else throw new Error("phase duhet të jetë 'single' ose 'three'.");
  const voltageDropSectionMM2=STANDARD_SECTIONS_MM2.find(s=>s>=exactSectionMM2)||null;
  const breakerA=STANDARD_BREAKERS_A.find(a=>a>=currentA)||null;
  const sectionForBreakerMM2=breakerA
    ? STANDARD_SECTIONS_MM2.find(s=>(CABLE_BREAKER_LIMITS_A[materialKey][s]||0)>=breakerA)||null
    : null;
  const recommendedSectionMM2=(voltageDropSectionMM2&&sectionForBreakerMM2)
    ? STANDARD_SECTIONS_MM2.find(s=>s>=Math.max(voltageDropSectionMM2,sectionForBreakerMM2))||null
    : null;
  return{
    powerW:P,
    currentA:Number(currentA.toFixed(2)),
    voltageDropV:Number(deltaU.toFixed(2)),
    exactSectionMM2:Number(exactSectionMM2.toFixed(2)),
    voltageDropSectionMM2,
    sectionForBreakerMM2,
    recommendedSectionMM2,
    breakerA,
    sectionMaxBreakerA:recommendedSectionMM2?(CABLE_BREAKER_LIMITS_A[materialKey][recommendedSectionMM2]||null):null
  };
}
function field(id,label,ph,unit){return `<div class="row"><label for="${id}">${label}</label><div class="inp"><input id="${id}" type="number" inputmode="decimal" placeholder="${ph}" autocomplete="off">${unit?`<span class="unit">${unit}</span>`:''}</div></div>`;}
function fieldValue(id,label,value,unit){return `<div class="row"><label for="${id}">${label}</label><div class="inp"><input id="${id}" type="number" inputmode="decimal" value="${value}" autocomplete="off">${unit?`<span class="unit">${unit}</span>`:''}</div></div>`;}
function matSelect(id){return `<div class="row"><label for="${id}">Materiali</label><div class="inp"><select id="${id}"><option value="cu">Bakër (Cu)</option><option value="al">Alumin (Al)</option></select></div></div>`;}
function result(lines){return `<div class="result">${lines.map(([lab,id])=>`<div class="res-line" data-row="${id}"><span class="rlabel" data-lbl="${id}">${lab}</span><span class="rval" id="${id}">—</span></div>`).join('')}</div>`;}
function small(t){return `<small>${t}</small>`;}
function seg(id,opts){return `<div class="seg" id="${id}" data-seg="0">${opts.map((o,i)=>`<button type="button" data-i="${i}" class="${i===0?'on':''}">${o}</button>`).join('')}</div>`;}
function g(id){const el=$('#'+id);return el?el.value:'';}
function setRes(id,txt){const el=$('#'+id);if(el)el.innerHTML=txt;}
function setLabel(id,txt){const el=$(`[data-lbl="${id}"]`);if(el)el.textContent=txt;}
function flagRow(id,cls){const row=$(`[data-row="${id}"]`);if(!row)return;row.classList.remove('warn','bad');if(cls)row.classList.add(cls);}
function getSeg(id){const el=$('#'+id);return el?parseInt(el.dataset.seg||'0'):0;}

kabllo:[
{title:'Seksioni i kabllit nga fuqia',formula:'W/kW → A → mm² + automat A',
 html:`${seg('cs_unit',['kW','W'])}${seg('cs_phase',['Njëfazor 230V','Trefazor 400V'])}
 ${field('cs_power','Fuqia','p.sh. 5','')}
 ${fieldValue('cs_voltage','Tensioni',230,'V')}
 ${field('cs_length','Gjatësia e kabllit','p.sh. 30','m')}
 ${matSelect('cs_mat')}
 ${fieldValue('cs_cos','Faktori i fuqisë cosφ',1,'')}
 ${fieldValue('cs_drop','Rënia e lejuar',3,'%')}
 <button type="button" class="calc-action" id="cs_calculate">Llogarit seksionin</button>
 <div class="calc-error" id="cs_error"></div>
 ${result([['Rryma e llogaritur','cs_current'],['Rënia e lejuar','cs_dropv'],['Seksioni matematikor','cs_exact'],['Seksioni nga rënia','cs_drop_section'],['Seksioni final','cs_recommended'],['Automati','cs_breaker']])}
 <div class="note"><b>Kujdes:</b> Automati zgjidhet si vlera standarde mbi rrymën e llogaritur dhe seksioni final rritet kur duhet ta mbajë atë mbrojtje. Verifiko gjithmonë temperaturën, grupimin, mënyrën e instalimit, kurbën B/C/D dhe normativën para zbatimit.</div>`,
 compute(){
   const power=num(g('cs_power')),lengthM=num(g('cs_length'));
   const phase=getSeg('cs_phase')?'three':'single';
   const powerUnit=getSeg('cs_unit')?'W':'kW';
   const voltage=num(g('cs_voltage'))??(phase==='three'?400:230);
   const material=(g('cs_mat')||'cu')==='cu'?'copper':'aluminium';
   const cosPhi=num(g('cs_cos'))??1;
   const voltageDropPercent=num(g('cs_drop'))??3;
   const error=$('#cs_error');
   if(power===null||lengthM===null){
     ['cs_current','cs_dropv','cs_exact','cs_drop_section','cs_recommended','cs_breaker'].forEach(id=>setRes(id,'—'));
     if(error){error.textContent='Plotëso fuqinë dhe gjatësinë e kabllit.';error.classList.add('show');}
     flagRow('cs_recommended','');flagRow('cs_breaker','');return;
   }
   try{
     const out=calculateCableSection({power,powerUnit,phase,voltage,lengthM,material,cosPhi,voltageDropPercent});
     if(error){error.textContent='';error.classList.remove('show');}
     setRes('cs_current',fmt(out.currentA,2)+' A');
     setRes('cs_dropv',fmt(out.voltageDropV,2)+' V');
     setRes('cs_exact',fmt(out.exactSectionMM2,2)+' mm²');
     setRes('cs_drop_section',out.voltageDropSectionMM2?fmt(out.voltageDropSectionMM2,1)+' mm²':'Mbi 630 mm²');
     setRes('cs_recommended',out.recommendedSectionMM2?fmt(out.recommendedSectionMM2,1)+' mm²':'Mbi 630 mm²');
     setRes('cs_breaker',out.breakerA?fmt(out.breakerA,0)+' A':'Mbi 630 A');
     flagRow('cs_recommended',out.recommendedSectionMM2?'':'bad');
     flagRow('cs_breaker',(out.breakerA&&out.recommendedSectionMM2)?'':'bad');
   }catch(e){
     ['cs_current','cs_dropv','cs_exact','cs_drop_section','cs_recommended','cs_breaker'].forEach(id=>setRes(id,'—'));
     if(error){error.textContent=e.message||'Kontrollo vlerat e vendosura.';error.classList.add('show');}
     flagRow('cs_recommended','bad');
     flagRow('cs_breaker','bad');
   }
 }},

   const need=n4*25+nh*5+nc*4+ng*3;const plan=need*(1+Math.max(0,margin));

{title:'Kablli Ethernet pa humbje lidhjeje',formula:'L total = L fiks + patch-cord · Kanal bakri ≤ 100 m',
 html:`${seg('eth_speed',['100 Mbps','1 Gbps','2.5 Gbps','10 Gbps'])}${seg('eth_env',['Shtëpi / zyrë','Industri / shumë kabllo fuqie'])}
 ${field('eth_fixed','Kablli fiks në mur/kanal','p.sh. 75','m')}
 ${fieldValue('eth_patch','Patch-cord gjithsej',5,'m')}
 ${result([['Gjatësia totale','eth_total'],['Rezerva deri në limit','eth_margin'],['Kablli i rekomanduar','eth_cat'],['Rezultati','eth_status'],['Kabllo për ta blerë','eth_buy']])}
 <div class="note"><b>Për sinjal të qëndrueshëm:</b> përdor bakër solid, jo CCA; mos bëj bashkime në mes; mbaj kabllin larg motorëve, VFD-ve dhe kabllove të fuqisë. Kablli i ekranizuar ndihmon vetëm kur ekranimi dhe tokëzimi janë realizuar saktë. Për mbi 100 m përdor fibër ose switch të ndërmjetëm të furnizuar siç duhet.</div>`,
 compute(){
   const fixed=num(g('eth_fixed')),patch=num(g('eth_patch'))??0,speed=getSeg('eth_speed'),industrial=getSeg('eth_env')===1;
   if(fixed===null||fixed<0||patch<0){['eth_total','eth_margin','eth_cat','eth_status','eth_buy'].forEach(id=>setRes(id,'—'));return;}
   const total=fixed+patch,margin=100-total;
   const categories=['Cat5e U/UTP','Cat5e ose Cat6','Cat6','Cat6A'];
   let cable=categories[speed];
   if(industrial)cable=speed===3?'Cat6A F/UTP ose fibër':'Cat6 F/UTP ose fibër';
   const fixedOk=fixed<=90,patchOk=patch<=10,totalOk=total<=100;
   let status='Në rregull';let cls='';
   if(!totalOk){status='Mbi 100 m: përdor fibër ose switch ndërmjetës';cls='bad';}
   else if(!fixedOk||!patchOk){status='Rishpërndaj gjatësinë: maksimumi praktik 90 m fiks + 10 m patch';cls='warn';}
   else if(margin<10){status='Funksionon, por ka pak rezervë për patch-cord';cls='warn';}
   setRes('eth_total',fmt(total,1)+' m');
   setRes('eth_margin',margin>=0?fmt(margin,1)+' m':'Tejkaluar me '+fmt(Math.abs(margin),1)+' m');
   setRes('eth_cat',cable+small(speed===3?'10 Gbps deri në 100 m me instalim Cat6A të plotë':'terminim dhe testim sipas kategorisë'));
   setRes('eth_status',status);setRes('eth_buy',fmt(fixed*1.1+patch,1)+' m'+small('përfshin 10% rezervë montimi'));
   flagRow('eth_status',cls);flagRow('eth_margin',totalOk?'':'bad');
 }}

function symbolSvg(type,code=''){
  const stroke='stroke="#111" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"';
  const text=(value,x=80,y=42,size=16)=>`<text x="${x}" y="${y}" text-anchor="middle" font-family="Arial,sans-serif" font-size="${size}" font-weight="700" fill="#111">${escHtml(value)}</text>`;
  const line=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${stroke}/>`;
  let d='';
  switch(type){
    case'wire':d=line(15,35,145,35);break;
    case'junction':d=line(15,35,145,35)+line(80,8,80,62)+`<circle cx="80" cy="35" r="5" fill="#111"/>`;break;
    case'crossover':d=line(15,35,65,35)+`<path d="M65 35 Q80 15 95 35" ${stroke}/>`+line(95,35,145,35)+line(80,8,80,20)+line(80,50,80,62);break;
    case'terminal':d=line(15,35,68,35)+`<circle cx="80" cy="35" r="11" ${stroke}/>`+line(92,35,145,35);break;
    case'busbar':d=`<rect x="24" y="29" width="112" height="12" fill="#111"/>`+line(45,10,45,29)+line(80,10,80,29)+line(115,10,115,29)+line(45,41,45,62)+line(80,41,80,62)+line(115,41,115,62);break;
    case'earth':d=line(80,8,80,30)+line(55,30,105,30)+line(62,40,98,40)+line(70,50,90,50);break;

{t:'2. Lexim analog dhe kalibrim sensori',g:'Meso ta kthesh vleren 0-1023 te ADC ne tension, temperature, presion ose nivel.',p:['ADC lexon tension, jo direkt temperature/presion. Formula varet nga sensori.','Kalibrimi behet me dy pika: minimum dhe maksimum real.','Mos beso sensorin pa filtruar zhurmen dhe pa krahasuar me instrument.'],code:`const int sensor=A0;

  int raw=analogRead(sensor);
  float volt=raw*5.0/1023.0;

{t:'3. Timer pa delay',g:'Meso te besh vonesa pa bllokuar programin, qe sensoret dhe butonat te lexohen vazhdimisht.',p:['delay() e ndalon programin dhe mund te humbasesh sinjale.','millis() lejon disa procese ne te njejten kohe.','Ky eshte themeli per makina automatike dhe PLC logic.'],code:`unsigned long t0=0;

{t:'4. PWM per shpejtesi motori',g:'Meso si komandohet shpejtesia e motorit DC ose drita LED me sinjal PWM.',p:['PWM nuk ndryshon tensionin real; ndryshon raportin ON/OFF.','Per motor perdor driver ose MOSFET logic-level, jo pin direkt.','Vendos diode/driver te duhur per ngarkesa induktive.'],code:`const int pwmPin=9;

{t:'5. State machine per cikle automatike',g:'Meso menyren profesionale per te shkruar cikle: IDLE, RUN, WAIT, ERROR.',p:['Cdo gjendje ka kusht hyrjeje dhe kusht daljeje.','Gabimet trajtohen ne gjendje te vecante ERROR.','E ben kodin me te lehte per ta zgjeruar dhe diagnostikuar.'],code:`enum State{IDLE,START_MOTOR,WAIT_SENSOR,STOP_MOTOR,ERROR};
State st=IDLE;
void loop(){
  bool start=digitalRead(2)==LOW;
  bool sensor=digitalRead(3)==LOW;
  switch(st){
    case IDLE: if(start) st=START_MOTOR; break;
    case START_MOTOR: digitalWrite(8,HIGH); st=WAIT_SENSOR; break;
    case WAIT_SENSOR: if(sensor) st=STOP_MOTOR; break;
    case STOP_MOTOR: digitalWrite(8,LOW); st=IDLE; break;
    case ERROR: digitalWrite(8,LOW); break;
  }
}`},
{t:'6. PID - ideja kryesore',g:'Meso logjiken e kontrollit PID: gabimi, korrigjimi dhe stabiliteti.',p:['P reagon ndaj gabimit aktual.','I grumbullon gabimin me kohe dhe heq offset-in.','D frenon ndryshimin e shpejte dhe ul tejkalimin.'],code:`float kp=1.2,ki=0.05,kd=0.01;
float integral=0,lastErr=0;
unsigned long lastT=0;
float pid(float setpoint,float feedback){
  float dt=(millis()-lastT)/1000.0;
  if(dt<=0)dt=0.001;
  float err=setpoint-feedback;
  integral+=err*dt;
  float deriv=(err-lastErr)/dt;
  lastErr=err; lastT=millis();
  return kp*err+ki*integral+kd*deriv;
}`},
]},

function plcProgram(name){
  if(name.includes('yll-trekëndësh'))return `(* ${name} - IEC 61131-3 Structured Text *)
VAR
  Start, StopNC, ThermalOK : BOOL;
  KLine, KStar, KDelta : BOOL;
  RunLatch : BOOL;
  T_Star : TON;
END_VAR

RunLatch := (Start OR RunLatch) AND StopNC AND ThermalOK;
KLine := RunLatch;
T_Star(IN := RunLatch, PT := T#5s);
KStar := RunLatch AND NOT T_Star.Q AND NOT KDelta;
KDelta := RunLatch AND T_Star.Q AND NOT KStar;

(* Daljet: KLine=Q0.0, KStar=Q0.1, KDelta=Q0.2 *)
(* Përdor edhe interlock elektrik NC mes KStar dhe KDelta. *)`;
  if(name.includes('pompa'))return `(* ${name} - alternim automatik i dy pompave *)
VAR
  NivelStart, NivelStop, Fault1, Fault2 : BOOL;
  P1, P2, SelectPump : BOOL;
  CycleDone : R_TRIG;
END_VAR

CycleDone(CLK := NivelStop);
IF CycleDone.Q THEN SelectPump := NOT SelectPump; END_IF;

P1 := NivelStart AND NOT NivelStop AND NOT Fault1
      AND (NOT SelectPump OR Fault2);
P2 := NivelStart AND NOT NivelStop AND NOT Fault2
      AND (SelectPump OR Fault1);

(* Shto timeout, dry-run dhe alarm për nivel shumë të lartë. *)`;
  if(name.includes('ashensor'))return `(* ${name} - model mësimor me 3 kate *)
VAR
  Call1, Call2, Call3, At1, At2, At3, DoorClosed : BOOL;
  MotorUp, MotorDown, DoorOpen : BOOL;
  Target : INT := 1;
END_VAR

IF Call1 THEN Target := 1; ELSIF Call2 THEN Target := 2; ELSIF Call3 THEN Target := 3; END_IF;
MotorUp := DoorClosed AND ((Target=2 AND At1) OR (Target=3 AND NOT At3));
MotorDown := DoorClosed AND ((Target=2 AND At3) OR (Target=1 AND NOT At1));
DoorOpen := (Target=1 AND At1) OR (Target=2 AND At2) OR (Target=3 AND At3);

(* Vetëm për maket: ashensori real kërkon PLC safety dhe standarde të posaçme. *)`;
  if(name.includes('linjë'))return `(* ${name} - transportier dhe numërim *)
VAR
  Start, StopNC, PartSensor, PositionSensor : BOOL;
  Conveyor, Packer : BOOL;
  Parts : CTU;
  PackTime : TON;
END_VAR

Conveyor := Start AND StopNC AND NOT PositionSensor;
Parts(CU := PartSensor, R := Packer, PV := 10);
PackTime(IN := Parts.Q, PT := T#2s);
Packer := Parts.Q AND NOT PackTime.Q;

(* Pas paketimit bëj reset të numëruesit dhe rinis transportierin. *)`;
  return `(* ${name} - komandim ndriçimi *)
VAR
  Button, AutoClock, StopAll : BOOL;
  Toggle : R_TRIG;
  LightZone : BOOL;
END_VAR

Toggle(CLK := Button);
IF Toggle.Q THEN LightZone := NOT LightZone; END_IF;
IF AutoClock THEN LightZone := TRUE; END_IF;
IF StopAll THEN LightZone := FALSE; END_IF;

Q0.0 := LightZone;`;
}

function pidProgram(name){
  const target=name.includes('temperature')?'75.0':name.includes('presioni')?'4.0':name.includes('niveli')?'60.0':name.includes('shpejtësie')?'1450.0':'90.0';
  return `// ${name} - kontroll PID bazë Arduino/ESP32
const int sensorPin = A0;
const int outputPin = 9;
float setpoint = ${target}, kp = 2.0, ki = 0.4, kd = 0.1;
float integral = 0, lastError = 0;
unsigned long lastMs = 0;

float readProcessValue() {
  int raw = analogRead(sensorPin);
  return raw * (100.0 / 1023.0); // Kalibroje për sensorin real
}

void setup() {
  pinMode(outputPin, OUTPUT);
  lastMs = millis();
}

void loop() {
  float dt = (millis() - lastMs) / 1000.0;
  if (dt < 0.1) return;
  lastMs = millis();
  float value = readProcessValue();
  float error = setpoint - value;
  integral = constrain(integral + error * dt, -255, 255);
  float derivative = (error - lastError) / dt;
  int output = constrain(kp*error + ki*integral + kd*derivative, 0, 255);
  analogWrite(outputPin, output);
  lastError = error;
}`;
}

async function copyProjectCode(key,button){
  const text=PROJECT_PROGRAMS.get(key)||'';
  try{
    if(navigator.clipboard && window.isSecureContext)await navigator.clipboard.writeText(text);
    else{
      const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';
      document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();
    }
    button.textContent='U kopjua';
    button.classList.add('copied');
    setTimeout(()=>{button.textContent='Kopjo kodin';button.classList.remove('copied');},1600);
  }catch(e){button.textContent='Zgjidh kodin';}
}

function wireCardPhotos(root=$('#app')){
  if(!root)return;
  root.querySelectorAll('.card-photo img').forEach(img=>{
    const card=img.closest('.card-photo');
    const loaded=()=>card&&card.classList.remove('loading');
    if(img.complete&&img.naturalWidth)loaded();
    else img.addEventListener('load',loaded,{once:true});
    img.addEventListener('error',()=>{
      if(card){card.classList.remove('loading');card.classList.add('fallback');}
      img.src=imagePlaceholder(img.dataset.photoLabel||'Foto');
    },{once:true});
  });
}

function renderFaults(filter=''){

        ...fault.c,...fault.k,...fault.z
      ].join(' ').toLowerCase();

      if(ok)shown++;

    });

    return `<div class="cat-title">${group.cat}</div><div class="comp-grid">${items.map(fault=>`
      <article class="fault-card">
        <div class="fault-head">

        <details class="fault-detail">
          <summary>Pse ndodh / shkaqet</summary>
          <div class="fault-body">${faultList(fault.c)}</div>
        </details>
        <details class="fault-detail">
          <summary>Hapat qe kontrollon ti</summary>
          <div class="fault-body">${faultSteps(fault.k)}</div>
        </details>
        <details class="fault-detail fault-fix">
          <summary>Si do ta zgjidhesh ti</summary>
          <div class="fault-body">${faultSteps(fault.z)}</div>
        </details>
        ${photoCard(fault.q,fault.n,'Foto e defektit')}
        <a class="fault-photo" href="${imageSearchUrl(fault.q)}" rel="noopener">Shiko foto dhe shembuj</a>
      </article>`).join('')}</div>`;
  }).join('');
  $('#app').innerHTML=`<div class="technician-banner"><b>Ti je tekniku:</b> app-i te ndihmon te gjesh shkakun, te ndjekesh kontrollet me radhe dhe te zgjedhesh riparimin. Ti ben matjet, konfirmon defektin, kryen zgjidhjen dhe teston pajisjen para dorezimit.</div>
  <div class="safety-banner">
    <b>Siguria e para:</b> shkëput, izolo dhe verifiko mungesën e tensionit para punës. Mos anashkalo MCB, RCD, termik, interlock ose safety relay.

    <input type="text" class="search" id="faultsearch" placeholder="Përshkruaj problemin… (p.sh. frigorifer, lavatriçe, PCB, motor, PLC)" value="${filter.replace(/"/g,'&quot;')}">
    <div class="lib-count"><b>${shown}</b> nga ${total} probleme diagnostikuese · nga shtëpia deri te industria</div>
  </div>
  ${html||'<div class="note">Nuk u gjet problem i ngjashëm — provo simptomën ose emrin e pajisjes.</div>'}`;
  const inp=$('#faultsearch');
  inp.addEventListener('input',()=>{
    const pos=inp.selectionStart;
    renderFaults(inp.value);

    next.focus();
    next.setSelectionRange(pos,pos);

    <div class="home-trust"><span><b>✓</b>I besueshëm</span><span><b>✓</b>Praktik</span><span><b>◷</b>Kursen kohë</span><span><b>⌁</b>Mëso çdo ditë</span></div>
    <div class="creator-credit">Aplikacioni është krijuar nga një shqiptar me emrin <b>Martin Meta</b></div>
    <div class="home-tagline">VOLTEX – partneri yt për çdo projekt teknik.</div>
  </section>`;
  $('#app').querySelectorAll('[data-go]').forEach(button=>button.addEventListener('click',()=>setMode(button.dataset.go)));
  if(typeof window.createLemonSqueezy==='function')window.createLemonSqueezy();
}
function render(){
  document.body.classList.toggle('home-mode',mode==='home');
  renderTabs();
  if(mode==='home')renderHome();
  else if(mode==='electric')renderElectricBasics();
  else if(mode==='calc')renderCalc();
  else if(mode==='lib')renderLib();
  else if(mode==='proj')renderProj();
  else if(mode==='program')renderProgram();
  else if(mode==='mechanics')renderMechanics();
  else if(mode==='symbols')renderSymbols();
  else if(mode==='rules')renderRules();
  else if(mode==='diagnostics')renderDiagnostics();
  else renderFaults();
}
function setMode(next){
  mode=next;
  if(location.protocol!=='file:')history.replaceState(null,'',next==='home'?location.pathname:'#'+next);
  document.querySelectorAll('.mode').forEach(button=>button.classList.toggle('on',button.dataset.mode===mode));
  render();window.scrollTo({top:0});
}
const requestedMode=location.hash.slice(1);
if(['electric','calc','lib','proj','program','mechanics','symbols','rules','faults','diagnostics'].includes(requestedMode))mode=requestedMode;

let voltexInstallPrompt=null;
window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();
  voltexInstallPrompt=event;
  const status=document.getElementById('voltexInstallStatus');
  if(status)status.textContent='Gati për instalim në këtë pajisje.';
});
window.addEventListener('appinstalled',()=>{
  voltexInstallPrompt=null;
  const status=document.getElementById('voltexInstallStatus');
  if(status)status.textContent='VOLTEX u instalua me sukses.';
});
async function installVoltexApp(){
  const status=document.getElementById('voltexInstallStatus');
  if(voltexInstallPrompt){
    voltexInstallPrompt.prompt();
    const choice=await voltexInstallPrompt.userChoice;
    if(status)status.textContent=choice.outcome==='accepted'?'Instalimi u pranua.':'Instalimi u anulua.';
    voltexInstallPrompt=null;
    return;
  }
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(isIOS){
    if(status)status.textContent='Në iPhone: hape në Safari → Share → Add to Home Screen.';
  }else{
    if(status)status.textContent='Përdor menunë e shfletuesit dhe zgjidh “Install app” ose “Add to Home screen”.';
  }
}
if('serviceWorker' in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
render();
document.querySelectorAll('.mode').forEach(button=>button.addEventListener('click',()=>setMode(button.dataset.mode)));
$('#brandHome').addEventListener('click',()=>setMode('home'));
$('#brandHome').addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();setMode('home');}});
$('#closeTheme').addEventListener('click',()=>setMode('home'));
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;
  active=b.dataset.tab;render();window.scrollTo({top:0,behavior:'smooth'});});
</script>
<script src="auth.js"></script>
</body>
</html>
