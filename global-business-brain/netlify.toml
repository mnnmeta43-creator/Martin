# Global Business Brain — konfigurimi i Netlify-t (base directory: global-business-brain).
# Next.js zbulohet automatikisht nga Netlify (OpenNext adapter). Funksionet më poshtë bëjnë
# rifreskimin e të dhënave në server, edhe kur askush nuk e ka hapur aplikacionin.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
